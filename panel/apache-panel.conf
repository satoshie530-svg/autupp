ServerName localhost
DirectoryIndex index.html

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Lo que leen los TVs vive en el volumen /data. Solo se exponen catalog.json y
# media/; backups/ y tmp/ quedan inaccesibles desde afuera.
Alias /catalog.json /data/catalog.json
Alias /media/ /data/media/

<Directory /data>
    Options -Indexes
    Require all denied
</Directory>

<Directory /data/media>
    Require all granted
    # Los nombres de archivo nunca se reutilizan, así que se pueden cachear.
    Header set Cache-Control "public, max-age=604800"
    Header set Access-Control-Allow-Origin "*"
</Directory>

<Location /catalog.json>
    Require all granted
    Header set Cache-Control "no-cache"
    Header set Access-Control-Allow-Origin "*"
</Location>
